# Raspberry Pi Pico 2 (RP2350).
#
# Layout from tock/boards/raspberry_pi_pico_2/layout.ld (boot from flash).
# Python tockloader has no app address for this board and falls back to
# 0x30000, so today users must pass --app-address by hand.

[board]
name = "raspberry_pi_pico_2"
description = "Raspberry Pi Pico 2"
# Tock builds Cortex-M33 apps as cortex-m4 TBFs today.
arch = "cortex-m4"

[layout]
flash = { start = 0x1000_0000, size = "4M" }
kernel = { start = 0x1000_0000, size = "256K" }
apps = { start = 0x1004_0000, size = "256K" }
app_ram = { start = 0x2000_0000, size = "520K" }
attributes = false

# Same rules Python tockloader applies to every cortex-m board. The RP2350's
# ARMv8-M MPU may not need them (open question).
[layout.placement]
order = "size_descending"
size = "power_of_two"
alignment = "size"

[connection]
default = "openocd"

[connection.openocd]
# The erase unit, which only this transport needs to know.
page_size = 4096
# Needs an openocd that knows RP2350: 0.13 or Raspberry Pi's fork. 0.12
# ships rp2040.cfg only.
target = ["target/rp2350.cfg"]
# This board has *no* onboard debugger, so `probe` is a guess at the common
# case -- a Raspberry Pi Debug Probe, or another Pico running picoprobe.
# With a J-Link or ST-Link, override just this in your user config:
#   [transports.openocd]
#   probe = ["interface/jlink.cfg", { command = "transport select swd" }]
probe = ["interface/cmsis-dap.cfg", { command = "transport select swd" }]

[connection.probe-rs]
chip = "RP235x"
