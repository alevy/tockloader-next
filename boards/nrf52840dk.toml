# Nordic nRF52840 DK.
#
# Layout from tock/boards/nordic/nrf52840_chip_layout.ld. In the proposed
# model this file lives next to that linker script; this copy is the bundled
# snapshot.

[board]
name = "nrf52840dk"
description = "Nordic nRF52840 DK"
arch = "cortex-m4"
# How this board is normally reached; override with --transport, or in
# Tock.toml or your user config.
transport = "openocd"

[layout]
flash = { start = 0x0000_0000, size = "1M" }
kernel = { start = 0x0000_0000, size = "256K" }
apps = { start = 0x0004_0000, size = "768K" }
app_ram = { start = 0x2000_0000, size = "256K" }
# The nRF52840 DK kernel has no attribute table.
attributes = false

# Cortex-M MPU: power-of-two sizes, aligned to their size.
[layout.placement]
order = "size_descending"
size = "power_of_two"
alignment = "size"

[transports.openocd]
# The erase unit, which only this transport needs to know.
page_size = 4096
# `target` is the chip: the same for everyone with this board.
target = ["target/nrf52.cfg"]
# `probe` is what is plugged in. This board has a J-Link OB soldered on, so
# this is right for almost everyone -- but if you debug it with an external
# probe instead, override just this in your user config:
#   [transports.openocd]
#   probe = ["interface/cmsis-dap.cfg", { command = "transport select swd" }]
probe = ["interface/jlink.cfg", { command = "transport select swd" }]

[transports.probe-rs]
chip = "nRF52840_xxAA"

# Handled by an external transport plugin (tock-transport-jlink).
[transports.jlink]
# `chip`, not `device`: the same thing probe-rs calls `chip` above, and not
# what `--device` means (a board you have, named in your user config).
chip = "nrf52840_xxAA"
speed = 1200
