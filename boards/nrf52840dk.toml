# Nordic nRF52840 DK.
#
# Layout from tock/boards/nordic/nrf52840_chip_layout.ld. In the proposed
# model this file lives next to that linker script; this copy is the bundled
# snapshot.

[board]
name = "nrf52840dk"
description = "Nordic nRF52840 DK"
arch = "cortex-m4"

[layout]
flash = { start = 0x0000_0000, size = "1M", page_size = "4K" }
kernel = { start = 0x0000_0000, size = "256K" }
apps = { start = 0x0004_0000, size = "768K" }
app_ram = { start = 0x2000_0000, size = "256K" }
# The nRF52840 DK kernel has no attribute table.
attributes = false

# Cortex-M MPU: power-of-two sizes, aligned to their size.
[layout.placement]
order = "size_descending"
size = "power_of_two"
alignment = "size"

[connection]
default = "openocd"

[connection.openocd]
config = ["board/nordic_nrf52_dk.cfg"]

[connection.probe-rs]
chip = "nRF52840_xxAA"

# Handled by an external transport plugin (tock-transport-jlink).
[connection.jlink]
device = "nrf52840_xxAA"
speed = 1200
