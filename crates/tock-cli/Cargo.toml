[package]
name = "tock-cli"
description = "The `tock` command (config resolution, porcelain, broker) and the `tock-transport-file` transport."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "tock"
path = "src/main.rs"

[[bin]]
name = "tock-transport-file"
path = "transports/file.rs"

[[bin]]
name = "tock-transport-openocd"
path = "transports/openocd.rs"

[dependencies]
tbf.workspace = true
tock-board.workspace = true
tock-image.workspace = true
tock-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
anyhow.workspace = true
clap.workspace = true
tempfile.workspace = true
