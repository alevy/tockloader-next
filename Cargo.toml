[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "Apache-2.0 OR MIT"
publish = false

[workspace.dependencies]
tbf = { path = "crates/tbf" }
tock-board = { path = "crates/tock-board" }
tock-client = { path = "crates/tock-client" }
tock-image = { path = "crates/tock-image" }
tock-proto = { path = "crates/tock-proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tar = { version = "0.4", default-features = false }
thiserror = "1"
tempfile = "3.27"
libc = "0.2"
clap = { version = "4", features = ["derive", "env", "string"] }
